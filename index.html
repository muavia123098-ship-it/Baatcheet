<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hisab Kitab - Business Accounting</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F59E0B',    // Golden
                        secondary: '#0F172A',  // Charcoal Black
                        appBg: '#020617',      // Very Dark Blue
                        cardBg: '#1E293B',     // Dark Slate
                        accent: '#F59E0B'      // Golden
                    },
                    backgroundImage: {
                        'vibrant-dark': 'radial-gradient(circle at top right, #1e1b4b, #020617)',
                    }
                }
            }
        }
    </script>

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Urdu Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- HTML to PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>



    <!-- PWA & Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F59E0B">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hisab Kitab">



    <!-- Custom Styles -->
    <style>
        .page-container {
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1e1b4b, #020617);
            background-attachment: fixed;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Toast Animations */
        @keyframes slideIn {
            from {
                transform: translateY(-100%) translateX(-50%);
                opacity: 0;
            }

            to {
                transform: translateY(0) translateX(-50%);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0) translateX(-50%);
            }

            to {
                opacity: 0;
                transform: translateY(-20px) translateX(-50%);
            }
        }

        .animate-toast-in {
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .animate-toast-out {
            animation: fadeOut 0.5s ease-in forwards;
        }
    </style>
</head>

<body class="page-container text-white h-screen flex flex-col overflow-hidden selection:bg-primary/30">

    <!-- Toast Notification Container -->
    <div id="toast-container"
        class="fixed top-6 left-1/2 -translate-x-1/2 z-[10000] flex flex-col gap-3 pointer-events-none"></div>

    <!-- Loading Splash Screen -->
    <div id="splash-screen"
        class="fixed inset-0 z-[9999] bg-gradient-to-br from-secondary via-secondary to-indigo-950 flex flex-col items-center justify-center">
        <!-- Animated Background Circles -->
        <div class="absolute inset-0 overflow-hidden">
            <div class="absolute top-20 left-10 w-64 h-64 bg-primary/10 rounded-full blur-3xl animate-pulse"></div>
            <div class="absolute bottom-20 right-10 w-80 h-80 bg-indigo-500/10 rounded-full blur-3xl animate-pulse"
                style="animation-delay: 0.5s;"></div>
        </div>

        <!-- Logo and Text -->
        <div class="relative z-10 text-center space-y-6 animate-in fade-in zoom-in duration-700">
            <!-- Book Icon -->
            <div class="flex items-center justify-center mb-4">
                <div class="relative">
                    <img src="icon.png" alt="Hisab Kitab Logo"
                        class="w-24 h-24 rounded-3xl shadow-2xl shadow-primary/30 transform rotate-6 animate-bounce"
                        style="animation-duration: 3s;">
                    <div
                        class="absolute -top-2 -right-2 w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg animate-ping">
                        <i class="ri-check-line text-white text-sm"></i>
                    </div>
                </div>
            </div>


            <!-- App Name -->
            <div>
                <h1 class="text-5xl font-black text-white mb-2 tracking-tight">HISAB KITAB</h1>
                <p class="text-primary text-sm font-bold uppercase tracking-widest">Business Accounting</p>
            </div>

            <!-- Loading Dots -->
            <div class="flex items-center justify-center gap-2 mt-8">
                <div class="w-3 h-3 bg-primary rounded-full animate-bounce" style="animation-delay: 0s;"></div>
                <div class="w-3 h-3 bg-primary rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
                <div class="w-3 h-3 bg-primary rounded-full animate-bounce" style="animation-delay: 0.4s;"></div>
                <div class="w-3 h-3 bg-primary rounded-full animate-bounce" style="animation-delay: 0.6s;"></div>
                <div class="w-3 h-3 bg-primary rounded-full animate-bounce" style="animation-delay: 0.8s;"></div>
                <div class="w-3 h-3 bg-primary rounded-full animate-bounce" style="animation-delay: 1s;"></div>
            </div>

            <!-- Loading Text -->
            <p data-i18n="loadingData" class="text-slate-400 text-sm font-medium animate-pulse">Loading your business
                data...</p>
        </div>
    </div>

    <script>
        // Hide splash screen after 2 seconds
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.transition = 'opacity 0.5s ease-out';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500);
            }, 2000);
        });
    </script>


    <!-- Desktop Sidebar (Hidden on Mobile) -->
    <!-- Main Content Area -->
    <main class="flex-1 h-full overflow-y-auto overflow-x-hidden relative bg-transparent">



        <!-- Pages Container -->
        <div id="app-container" class="p-4 pb-24 md:p-8 max-w-5xl mx-auto">
            <!-- Dynamic Content will be injected here -->
            <div data-i18n="loadingApp" class="text-center py-20 text-gray-400">Loading Application...</div>
        </div>
    </main>

    <!-- Bottom Navigation (Mobile Only) -->
    <nav
        class="md:hidden fixed bottom-0 left-0 right-0 bg-secondary/90 backdrop-blur-lg border-t border-white/5 flex justify-around items-center py-2 px-1 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.3)]">
        <button onclick="router.navigate('dashboard')"
            class="nav-item flex flex-col items-center p-2 text-gray-400 hover:text-primary active:text-primary transition-colors"
            data-page="dashboard">
            <i class="ri-dashboard-line text-xl mb-1"></i>
            <span data-i18n="home" class="text-[10px] font-medium">Home</span>
        </button>
        <button onclick="router.navigate('parties')"
            class="nav-item flex flex-col items-center p-2 text-gray-400 hover:text-primary active:text-primary transition-colors"
            data-page="parties">
            <i class="ri-group-line text-xl mb-1"></i>
            <span data-i18n="parties" class="text-[10px] font-medium">Parties</span>
        </button>

        <!-- Fab Button for New Sale -->
        <div class="relative -top-5">
            <button onclick="router.navigate('new-sale')"
                class="bg-primary text-white rounded-full w-14 h-14 flex items-center justify-center shadow-lg border-4 border-[#0F172A] transform active:scale-95 transition-transform">
                <i class="ri-add-line text-3xl"></i>
            </button>
        </div>

        <button onclick="router.navigate('stock')"
            class="nav-item flex flex-col items-center p-2 text-gray-400 hover:text-primary active:text-primary transition-colors"
            data-page="stock">
            <i class="ri-box-3-line text-xl mb-1"></i>
            <span data-i18n="stock" class="text-[10px] font-medium">Stock</span>
        </button>
        <button onclick="router.navigate('sales')"
            class="nav-item flex flex-col items-center p-2 text-gray-400 hover:text-primary active:text-primary transition-colors"
            data-page="sales">
            <i class="ri-bill-line text-xl mb-1"></i>
            <span data-i18n="bills" class="text-[10px] font-medium">Bills</span>
        </button>
    </nav>


    <!-- Core Scripts -->
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script>
        i18n.init();
    </script>


</body>

</html>
